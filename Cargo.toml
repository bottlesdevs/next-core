[package]
name = "bottles-core"
description = "The application core for managing Bottles Next Wine and Proton environments."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/bottlesdevs/next-core/"
readme = "README.md"
homepage = ""
categories = [""]
keywords = [""]
exclude = [""]

[features]
default = ["fvs"]
fvs = ["dep:fvs-rs", "dep:regdiff-rs"]

[dependencies]
async-fs.workspace = true
async-compression.workspace = true
async-io.workspace = true
async-process.workspace = true
async-trait.workspace = true
blocking.workspace = true
derive_more = { workspace = true, features = ["from", "into", "into_iterator", "try_into"] }
download-manager.workspace = true
http.workspace = true
http-client = { workspace = true, features = ["reqwest"] }
next-config.workspace = true
next-paths.workspace = true
next-proto.workspace = true
fvs-rs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml = "0.9.10"
tracing.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tokio = { workspace = true, features = ["sync"] }
futures-core.workspace = true
futures-lite.workspace = true
futures-util.workspace = true
smol-tar.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
regdiff-rs = { workspace = true, optional = true }
semver.workspace = true
strum.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v5"] }

[dev-dependencies]
async-executor.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }

[package.metadata.docs.rs]
all-features = true
